<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <title>Detalle Aplicación</title>
</head>

<body>

    <div th:replace="~{fragments/navbar :: navbar}"></div>

    <h1>Detalle Aplicación</h1>

    <p>ID:
        <span th:text="${monitoredApplication.id}"></span>
    </p>

    <p>Nombre:
        <span th:text="${monitoredApplication.nombre}"></span>
    </p>

    <p>URL:
        <span th:text="${monitoredApplication.url}"></span>
    </p>

    <p>Tipo:
        <span th:text="${monitoredApplication.tipo}"></span>
    </p>

    <p>
        Criticality:
        <span th:text="${monitoredApplication.criticality}"></span>
    </p>

    <p>
        ExternalId:
        <span th:text="${monitoredApplication.externalId}"></span>
    </p>

    <p>Activo:
        <span th:text="${monitoredApplication.activo}"></span>
    </p>

    <hr>

    <h2>Historial de Resultados</h2>

    <table border="1">

        <tr>
            <th>External ID</th>
            <th>Estado</th>
            <th>HTTP</th>
            <th>Response Time (ms)</th>
            <th>Error</th>
        </tr>

        <tr th:each="result : ${executionResults}">

            <td th:text="${result.externalId}"></td>

            <td th:text="${result.status}"></td>

            <td th:text="${result.httpStatus}"></td>

            <td th:text="${result.responseTimeMs}"></td>

            <td th:text="${result.error}"></td>

        </tr>

    </table>

    <br>

    <a th:href="@{/applications}">
        Volver
    </a>

    <a th:href="@{/applications/edit/{id}(id=${monitoredApplication.id})}">
        Editar
    </a>

</body>

</html>
