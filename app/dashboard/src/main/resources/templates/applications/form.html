<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <title>Aplicación</title>
</head>

<body>

    <div th:replace="fragments/navbar :: navbar"></div>

    <h1 th:text="${monitoredApplication.id == null ? 'Nueva Aplicación' : 'Editar Aplicación'}"></h1>

    <form th:action="@{/applications/save}" th:object="${monitoredApplication}" method="post">

        <!-- ID: se envía únicamente al editar -->
        <input type="hidden" th:field="*{id}">

        Nombre:
        <input type="text" th:field="*{nombre}" required>

        <br><br>

        URL:
        <input type="text" th:field="*{url}" required>

        <br><br>

        Descripción:
        <input type="text" th:field="*{descripcion}">

        <br><br>

        Tipo:
        <input type="text" th:field="*{tipo}" required>

        <br><br>

        Umbral:
        <input type="number" th:field="*{umbralRespuestaMs}">

        <br><br>

        Activo:
        <input type="checkbox" th:field="*{activo}">

        <br><br>

        <button type="submit">Guardar</button>

        <a th:href="@{/applications}">Cancelar</a>

    </form>

</body>

</html>
