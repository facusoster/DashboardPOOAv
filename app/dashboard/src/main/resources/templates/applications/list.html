<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <title>Aplicaciones</title>
</head>

<body>

    <div th:replace="~{fragments/navbar :: navbar}"></div>

    <h1>Aplicaciones Monitoreadas</h1>

    <a href="/applications/new">
        Nueva aplicación
    </a>

    |

    <a href="/applications/import">
        Importar JSON
    </a>

    <hr>

    <form id="filterForm" method="get" th:action="@{/applications}">

        Nombre:

        <input type="text" name="search" th:value="${search}">

        Estado:

        <select name="activo" onchange="this.form.page.value=0; this.form.submit()">

            <option value="" th:selected="${activo == null}">
                Todos
            </option>

            <option value="true" th:selected="${activo == true}">
                Activos
            </option>

            <option value="false" th:selected="${activo == false}">
                Inactivos
            </option>

        </select>

        Mostrar:

        <select name="size" onchange="this.form.page.value=0; this.form.submit()">

            <option value="10" th:selected="${pageSize == 10}">
                10
            </option>

            <option value="20" th:selected="${pageSize == 20}">
                20
            </option>

            <option value="50" th:selected="${pageSize == 50}">
                50
            </option>

            <option value="100" th:selected="${pageSize == 100}">
                100
            </option>

        </select>

        <input type="hidden" name="page" th:value="${currentPage}">

        <button type="submit">
            Filtrar
        </button>

        <button type="button" onclick="window.location='/applications'">
            Limpiar filtros
        </button>

    </form>

    <br>

    <table border="1">

        <tr>
            <th>ID</th>
            <th>Nombre</th>
            <th>URL</th>
            <th>Tipo</th>
            <th>Criticidad</th>
            <th>Acciones</th>
        </tr>

        <tr th:each="app : ${applications}">

            <td th:text="${app.id}"></td>
            <td th:text="${app.nombre}"></td>
            <td th:text="${app.url}"></td>
            <td th:text="${app.tipo}"></td>
            <td th:text="${app.criticality}"></td>

            <td>

                <a th:href="@{/applications/{id}(id=${app.id})}">
                    Ver
                </a>

                |

                <a th:href="@{/applications/edit/{id}(id=${app.id})}">
                    Editar
                </a>

                |

                <form th:action="@{/applications/deactivate/{id}(id=${app.id})}" method="post" style="display:inline;"
                    th:if="${app.activo}">

                    <button type="submit" onclick="return confirm('¿Desactivar esta aplicación?');">
                        Desactivar
                    </button>

                </form>

            </td>

        </tr>

    </table>

    <br>

    <div>

        Página
        <span th:text="${currentPage + 1}"></span>
        de
        <span th:text="${totalPages}"></span>

    </div>

    <br>

    <div>

        <a th:if="${currentPage > 0}" th:href="@{/applications(
                page=${currentPage - 1},
                size=${pageSize},
                search=${search},
                activo=${activo}
           )}">
            ← Anterior
        </a>

        &nbsp;

        <a th:if="${currentPage + 1 < totalPages}" th:href="@{/applications(
                page=${currentPage + 1},
                size=${pageSize},
                search=${search},
                activo=${activo}
           )}">
            Siguiente →
        </a>

    </div>

</body>

</html>
