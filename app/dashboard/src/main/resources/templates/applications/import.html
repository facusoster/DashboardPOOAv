<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <title>Importar Aplicaciones</title>
</head>

<body>

    <div th:replace="~{fragments/navbar :: navbar}"></div>

    <h1>Importar IIS.json</h1>

    <form method="post"
          enctype="multipart/form-data"
          th:action="@{/applications/import}">

        Seleccione un archivo JSON:

        <br><br>

        <input type="file"
               name="file"
               accept=".json"
               required>

        <br><br>

        <button type="submit">
            Importar
        </button>

        <a th:href="@{/applications}">
            Cancelar
        </a>

    </form>

</body>

</html>
