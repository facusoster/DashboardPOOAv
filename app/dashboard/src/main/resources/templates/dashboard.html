<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <title>Dashboard</title>
</head>

<body>

    <div th:replace="fragments/navbar :: navbar"></div>

    <h1>Dashboard de Monitoreo</h1>

    <hr>

    <h2>Dashboard Health</h2>

    <p>
        Aplicaciones registradas:
        <strong
            th:text="${dashboardHealth.applicationsCount}">
        </strong>
    </p>

    <p>
        Aplicaciones activas:
        <strong
            th:text="${dashboardHealth.activeApplications}">
        </strong>
    </p>

    <p>
        Aplicaciones inactivas:
        <strong
            th:text="${dashboardHealth.inactiveApplications}">
        </strong>
    </p>

    <p>
        Aplicaciones sin monitoreo:
        <strong
            th:text="${dashboardHealth.unknownApplications}">
        </strong>
    </p>

    <hr>

    <p>
        Health Global:
        <strong
            th:text="${dashboardHealth.averageHealthScore}">
        </strong>
        / 100
    </p>

    <p>
        Healthy (≥ 80):
        <strong
            th:text="${dashboardHealth.healthyCount}">
        </strong>
    </p>

    <p>
        Degraded (50 - 79):
        <strong
            th:text="${dashboardHealth.degradedCount}">
        </strong>
    </p>

    <p>
        Critical (&lt; 50):
        <strong
            th:text="${dashboardHealth.criticalCount}">
        </strong>
    </p>

    <hr>

    <p>
        Mejor Score:
        <strong
            th:text="${dashboardHealth.bestHealthScore}">
        </strong>

        -

        <strong
            th:text="${dashboardHealth.bestApplicationName}">
        </strong>
    </p>

    <p>
        Peor Score:
        <strong
            th:text="${dashboardHealth.worstHealthScore}">
        </strong>

        -

        <strong
            th:text="${dashboardHealth.worstApplicationName}">
        </strong>
    </p>

</body>

</html>
