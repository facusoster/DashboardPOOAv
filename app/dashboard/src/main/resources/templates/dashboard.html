<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <title>Dashboard</title>
</head>

<body>

    <div th:replace="fragments/navbar :: navbar"></div>

    <h1>Dashboard de Monitoreo</h1>

    <hr>

    <p>
        Aplicaciones registradas:
        <strong th:text="${applicationsCount}"></strong>
    </p>

    <p>
        Ejecuciones registradas:
        <strong th:text="${executionsCount}"></strong>
    </p>

    <p>
        OK:
        <strong th:text="${okCount}"></strong>
    </p>

    <p>
        WARNING:
        <strong th:text="${warningCount}"></strong>
    </p>

    <p>
        ERROR:
        <strong th:text="${errorCount}"></strong>
    </p>

    <p>
        Porcentaje de éxito:
        <strong th:text="${successRate}"></strong>%
    </p>

</body>

</html>
