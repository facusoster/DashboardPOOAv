<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <title>Ejecuciones</title>
</head>

<body>

    <div th:replace="fragments/navbar :: navbar"></div>

    <h1>Ejecuciones</h1>

    <table border="1">

        <tr>
            <th>ID</th>
            <th>Execution ID</th>
            <th>Aplicación</th>
            <th>Estado</th>
            <th>Duración (ms)</th>
            <th>Total</th>
            <th>OK</th>
            <th>FAIL</th>
        </tr>

        <tr th:each="execution : ${executions}">

            <td th:text="${execution.id}"></td>

            <td th:text="${execution.executionId}"></td>

            <td th:text="${execution.application != null ? execution.application.nombre : 'N/A'}"></td>

            <td th:text="${execution.status}"></td>

            <td th:text="${execution.durationMs}"></td>

            <td th:text="${execution.total}"></td>

            <td th:text="${execution.okCount}"></td>

            <td th:text="${execution.failCount}"></td>

        </tr>

    </table>

</body>

</html>
