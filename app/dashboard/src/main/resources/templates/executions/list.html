<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <title>Ejecuciones</title>
</head>

<body>

    <div th:replace="fragments/navbar :: navbar"></div>

    <h1>Ejecuciones</h1>

    <form id="filterForm" method="get" th:action="@{/executions}">

        Estado:

        <select name="status" onchange="this.form.page.value=0; this.form.submit()">

            <option value="" th:selected="${status == null}">
                Todos
            </option>

            <option value="OK" th:selected="${status != null && status.name() == 'OK'}">
                OK
            </option>

            <option value="WARNING" th:selected="${status != null && status.name() == 'WARNING'}">
                WARNING
            </option>

            <option value="ERROR" th:selected="${status != null && status.name() == 'ERROR'}">
                ERROR
            </option>

            <option value="DEGRADED" th:selected="${status != null && status.name() == 'DEGRADED'}">
                DEGRADED
            </option>

        </select>

        Mostrar:

        <select name="size" onchange="this.form.page.value=0; this.form.submit()">

            <option value="10" th:selected="${pageSize == 10}">
                10
            </option>

            <option value="20" th:selected="${pageSize == 20}">
                20
            </option>

            <option value="50" th:selected="${pageSize == 50}">
                50
            </option>

            <option value="100" th:selected="${pageSize == 100}">
                100
            </option>

        </select>

        <input type="hidden" name="page" th:value="${currentPage}">

        <button type="button" onclick="window.location='/executions'">
            Limpiar filtros
        </button>

    </form>

    <br>

    <table border="1">

        <tr>
            <th>ID</th>
            <th>Execution ID</th>
            <th>Aplicación</th>
            <th>Estado</th>
            <th>Duración (ms)</th>
            <th>Total</th>
            <th>OK</th>
            <th>FAIL</th>
        </tr>

        <tr th:each="execution : ${executions}">

            <td th:text="${execution.id}"></td>

            <td th:text="${execution.executionId}"></td>

            <td th:text="${execution.application != null ? execution.application.nombre : 'N/A'}"></td>

            <td th:text="${execution.status}"></td>

            <td th:text="${execution.durationMs}"></td>

            <td th:text="${execution.total}"></td>

            <td th:text="${execution.okCount}"></td>

            <td th:text="${execution.failCount}"></td>

        </tr>

    </table>

    <br>

    <div>

        Página
        <span th:text="${currentPage + 1}"></span>
        de
        <span th:text="${totalPages}"></span>

    </div>

    <br>

    <div>

        <a th:if="${currentPage > 0}" th:href="@{/executions(
                page=${currentPage - 1},
                size=${pageSize},
                status=${status}
           )}">
            ← Anterior
        </a>

        &nbsp;

        <a th:if="${currentPage + 1 < totalPages}" th:href="@{/executions(
                page=${currentPage + 1},
                size=${pageSize},
                status=${status}
           )}">
            Siguiente →
        </a>

    </div>

</body>

</html>
