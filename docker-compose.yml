version: '3.9'

services:
  postgres:
    image: postgres:16
    container_name: dashboard-postgres
    restart: always
    environment:
      POSTGRES_USER: facu
      POSTGRES_PASSWORD: facu123
      POSTGRES_DB: dashboarddb
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - dashboard-net

  pgadmin:
    image: dpage/pgadmin4
    container_name: dashboard-pgadmin
    restart: always
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@local.com
      PGADMIN_DEFAULT_PASSWORD: admin123
    ports:
      - "5050:80"
    networks:
      - dashboard-net

networks:
  dashboard-net:

volumes:
  postgres_data:
